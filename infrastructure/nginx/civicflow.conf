# ==============================================================================
# CivicFlowAI — Production Nginx Configuration (High Performance & Reverse Proxy)
# ==============================================================================
# Features:
#   • Ultra-fast static delivery with Gzip compression (levels 6)
#   • 1-year immutable caching for Vite hashed assets (/assets/*)
#   • Instant cache invalidation for single-page application entrypoint (/index.html)
#   • Low kernel overhead via open_file_cache
#   • Reverse proxy to Python FastAPI Backend (http://127.0.0.1:5000)
#   • Unbuffered, keep-alive SSE streaming for real-time events (/api/events)
#   • 25MB upload limit for photographic complaint evidence
#   • Production security headers (X-Frame-Options, X-Content-Type-Options, etc.)
# ==============================================================================

# Upstream definition for FastAPI Backend Gateway
upstream civicflow_backend_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Root directory where built React frontend is placed
    root /var/www/civicflow/dist;
    index index.html;

    # Maximum upload size for citizen image evidence
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Gzip Compression for Blazing-Fast Frontend Delivery
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        font/truetype
        font/opentype;

    # Low-latency file caching
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Static Assets: Long-term Caching for Vite Hashed Files
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon, robots, and static media
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # React SPA Entrypoint: Prevent Stale Application Caching
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # React SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Realtime SSE Streaming (/api/events)
    # Crucial: Disable proxy buffering and keep connection open
    # --------------------------------------------------------------------------
    location = /api/events {
        proxy_pass http://civicflow_backend_upstream/api/events;
        proxy_http_version 1.1;

        # Disable all buffering for immediate event broadcast
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # SSE Connection Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent event connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # FastAPI Backend Gateway Proxy (/api/ and /docs)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://civicflow_backend_upstream/api/;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts suitable for Multi-Agent AI deliberation
        proxy_connect_timeout 60s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # Backend OpenAPI Docs & Schema
    location /docs {
        proxy_pass http://civicflow_backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://civicflow_backend_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://civicflow_backend_upstream/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Health Check
    location /health {
        proxy_pass http://civicflow_backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
