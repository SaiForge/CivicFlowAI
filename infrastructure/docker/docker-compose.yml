services:
  # 1. Multi-Agent AI Engine (Python FastAPI)
  agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    container_name: civicflow_agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../../agent/.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-openai/gpt-4o-mini}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AGENT_DELAY_SECONDS=${AGENT_DELAY_SECONDS:-5.0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-1.5-flash}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.7}
      - DATABASE_URL=sqlite:///./civic.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../agent:/agent
    networks:
      - civicnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Backend API Gateway (Python FastAPI)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: civicflow_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - AGENT_SERVICE_URL=http://agent:8000
      - BACKEND_PORT=5000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../backend:/backend
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - civicnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. React Frontend Application (Vite + Nginx)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: civicflow_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - civicnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  civicnet:
    driver: bridge
