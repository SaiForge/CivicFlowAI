name: Build, Test & Deploy CivicFlowAI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Test & Quality Gate Job
  # ============================================================================
  test:
    name: Run Quality Gate & Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f agent/requirements.txt ]; then pip install -r agent/requirements.txt; fi

      - name: Run Multi-Agent Quality Gate Tests
        run: |
          cd agent
          pytest tests/test_verification_rubric.py -v

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

  # ============================================================================
  # 2. Deploy to Azure VM (Native Systemd & High-Performance Nginx — No Containers)
  # ============================================================================
  deploy_azure_vm:
    name: Deploy to Azure VM (Native Nginx & Systemd)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script_stop: true
          envs: |
            SUPABASE_DATABASE_URL
            OPENROUTER_API_KEY
            OPENROUTER_MODEL_NAME
            AGENT_DELAY_SECONDS
            SECRET_KEY
          script: |
            set -euo pipefail
            echo "=================================================="
            echo " Starting CivicFlowAI Native VM Deployment"
            echo " Host: $(hostname)"
            echo "=================================================="

            APP_DIR="/home/${{ secrets.AZURE_VM_USERNAME }}/CivicFlowAI"

            # 1. Clone repository if not present, otherwise pull latest commit
            if [ ! -d "$APP_DIR" ]; then
              echo "--> Cloning repository into $APP_DIR..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "--> Pulling latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Configure Production Environment Variables (.env)
            echo "--> Writing production .env configuration..."
            cat << 'EOF' > .env
            # ── Database (Supabase Cloud PostgreSQL) ───────────────────
            DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL || 'postgresql://civicflow:civicflow_secret@localhost:5432/civicflow' }}

            # ── Redis Cache & Pub/Sub ──────────────────────────────────
            REDIS_URL=redis://127.0.0.1:6379/0

            # ── Multi-Agent Engine Settings ────────────────────────────
            LLM_PROVIDER=openrouter
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENROUTER_MODEL_NAME=${{ secrets.OPENROUTER_MODEL_NAME || 'openai/gpt-4o-mini' }}
            OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
            AGENT_DELAY_SECONDS=${{ secrets.AGENT_DELAY_SECONDS || '5.0' }}
            CONFIDENCE_THRESHOLD=0.7
            MAX_RETRIES=2

            # ── Backend Gateway Configuration ──────────────────────────
            AGENT_SERVICE_URL=http://127.0.0.1:8000
            BACKEND_PORT=5000
            SECRET_KEY=${{ secrets.SECRET_KEY || 'civicflow_prod_secret_key_2026_azure' }}
            ACCESS_TOKEN_EXPIRE_MINUTES=1440
            LOG_LEVEL=INFO
            EOF

            cp .env agent/.env
            cp .env backend/.env
            chmod 600 .env agent/.env backend/.env

            # 3. Execute Native Automated Deployment Script
            echo "--> Running native deployment script (Nginx + Systemd)..."
            chmod +x infrastructure/scripts/deploy-native.sh
            bash infrastructure/scripts/deploy-native.sh

            echo "=================================================="
            echo " Azure VM Deployment Finished Successfully!"
            echo "=================================================="

  # ============================================================================
  # 3. Deploy to Azure Static Web Apps (Optional: When Token is Configured)
  # ============================================================================
  deploy_azure_static_web_app:
    name: Deploy to Azure Static Web Apps (PaaS Mode)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Token Availability
        id: token_check
        run: |
          if [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Azure Static Web Apps token not set. Skipping PaaS upload."
          fi

      - name: Checkout Code
        if: steps.token_check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build And Deploy to Azure Static Web Apps
        if: steps.token_check.outputs.enabled == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "dist"
