services:
  # ──────────────────────────────────────────────────────────
  # 0. PostgreSQL — Offline Persistence (Docker)
  #    Switch to Supabase: just change DATABASE_URL in .env
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: civicflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-civicflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicflow} -d ${POSTGRES_DB:-civicflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # 0b. Redis — In-Memory High-Speed Cache & Realtime Pub/Sub
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: civicflow_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - civicnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # 1. Multi-Agent AI Engine (Python FastAPI :8000)
  # ──────────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: civicflow_agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-openai/gpt-4o-mini}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AGENT_DELAY_SECONDS=${AGENT_DELAY_SECONDS:-5.0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-1.5-flash}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.7}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-civicflow}:${POSTGRES_PASSWORD:-civicflow_secret}@postgres:5432/${POSTGRES_DB:-civicflow}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./agent:/agent
    networks:
      - civicnet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # 2. Backend API Gateway (Python FastAPI :5001)
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicflow_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - AGENT_SERVICE_URL=http://agent:8000
      - BACKEND_PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-civicflow}:${POSTGRES_PASSWORD:-civicflow_secret}@postgres:5432/${POSTGRES_DB:-civicflow}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production_civicflow_2024}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - civicnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # 3. React Frontend (Vite dev server :3000)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicflow_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - civicnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  civicnet:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
